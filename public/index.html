<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" href="/favicon.png"><meta name="theme-color" content="#6657f5">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#172033;--muted:#5b667a;--line:#d9dee6;--accent:#6657f5;--ok:#0f7b5f;--err:#b42318;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
:root{--field:#fff;--hov:var(--hov);--okbg:#dcf5ec;--toast:#172033;--sk1:#e3e7ec;--sk2:#f1f3f6;color-scheme:light}
:root[data-theme=dark]{--bg:#0e131b;--card:#161c27;--ink:#e7ebf3;--muted:#9aa5b8;--line:#283140;--accent:#8f84ff;--field:#0f141d;--hov:#3a4658;--ok:#3ccf9e;--okbg:#12372c;--err:#ff7b6e;--toast:#2a3342;--sk1:#1c2431;--sk2:#252f3f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--card:#161c27;--ink:#e7ebf3;--muted:#9aa5b8;--line:#283140;--accent:#8f84ff;--field:#0f141d;--hov:#3a4658;--ok:#3ccf9e;--okbg:#12372c;--err:#ff7b6e;--toast:#2a3342;--sk1:#1c2431;--sk2:#252f3f;color-scheme:dark}}
*{box-sizing:border-box}
.hr{display:flex;align-items:center;gap:16px}#theme{padding:6px 12px;font-size:13px}.chl{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-top:8px}.chl[hidden]{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font:700 20px var(--display);letter-spacing:-.01em}
.user{display:flex;align-items:center;gap:12px;color:var(--muted)}
.user img{width:28px;height:28px;border-radius:50%}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.gate{max-width:560px;margin:14vh auto;padding:0 24px}
.gate h1{font:700 40px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.gate p{color:var(--muted);margin:0 0 24px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}
nav{padding:18px 14px;border-right:1px solid var(--line);background:var(--card)}
nav h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 10px 10px}
.servers{display:flex;flex-wrap:wrap;gap:8px;padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sv{width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--bg);display:grid;place-items:center;font-weight:700;cursor:pointer;overflow:hidden;box-shadow:0 0 0 2px transparent;transition:transform .2s var(--ease),box-shadow .2s}
.sv img{width:100%;height:100%}
.sv:hover{transform:scale(1.1)}
.sv[aria-current=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
#mods button{position:relative;display:block;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;text-align:left;cursor:pointer;font-weight:500;transition:background-color .15s,padding .2s var(--ease)}
#mods button:hover{background:var(--bg);padding-left:16px}
#mods button[aria-current=true]{background:var(--bg);font-weight:600}
#mods button[aria-current=true]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
nav .add{display:block;margin:18px 10px 0;font-size:14px}
main{padding:28px;max-width:1180px;width:100%}
main h1{font:700 28px var(--display);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.h2{font:700 18px var(--display);margin:26px 0 12px}
.muted{color:var(--muted);margin:0}
.hero{display:flex;gap:18px;align-items:center;padding:26px;border-radius:16px;color:#fff;background:linear-gradient(115deg,#4f5bff,#8a5cf6 55%,#c057f0);background-size:200% 200%;animation:flow 14s ease infinite,up .5s var(--ease) both}
.hero .gi{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font:700 28px var(--display);overflow:hidden;flex:none}
.hero .gi img{width:100%;height:100%}
.hero h1{color:#fff;margin:0}.hero p{margin:2px 0 0;opacity:.85}
.stats,.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:16px}
.mods{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:0}
.stat,.mod,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat{padding:16px 18px}
.stat b{display:block;font:700 28px var(--display)}
.stat span{color:var(--muted);font-size:13px}
.mod{padding:18px}
.mod h3{margin:0;font:700 16px var(--display)}
.mod p{color:var(--muted);margin:6px 0 14px}
.rowb{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.pill.on{background:var(--okbg);color:var(--ok)}
.panel{padding:20px;margin-bottom:16px}
.panel h3{font:700 16px var(--display);margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid var(--line)}
dl{margin:0}dt{font:600 14px ui-monospace,Menlo,monospace;color:var(--accent);margin-top:10px}dt:first-child{margin-top:0}dd{margin:0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
label:first-of-type{margin-top:0}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--field)}
textarea{resize:vertical;min-height:72px}
.row{display:flex;gap:12px;align-items:center}.row>div{flex:1}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin:12px 0 0}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.switch{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(18px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:13px ui-monospace,Menlo,monospace;cursor:pointer}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;flex:none;background:var(--field);margin-top:19px}
.actions{display:flex;gap:10px;align-items:center}
.sticky{position:sticky;top:78px}
.pv-title{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.dc{background:#313338;color:#dbdee1;border-radius:10px;padding:16px;font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;gap:12px}
.dc .av{width:38px;height:38px;border-radius:50%;background:#171112;flex:none;display:grid;place-items:center;overflow:hidden}
.dc .meta{font-weight:600;color:#fff}
.dc .tag{background:#5865f2;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin:0 6px;vertical-align:1px}
.dc .time{font-size:12px;color:#949ba4;font-weight:400}
.mention{background:#3c4270;color:#c9cdfb;border-radius:3px;padding:0 2px}
.emb{margin-top:6px;background:#2b2d31;border-left:4px solid #888;border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.emb>*{min-width:0}
.emb .a{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff}
.emb .a img,.emb .f img{width:22px;height:22px;border-radius:50%}
.emb .t{font-weight:700;color:#fff;font-size:16px}.emb .d{font-size:14px;overflow-wrap:anywhere}
.emb .th{grid-column:2;grid-row:1/4;width:72px;height:72px;border-radius:6px;object-fit:cover}
.emb .f{grid-column:1/3;display:flex;align-items:center;gap:8px;font-size:12px;color:#b5bac1;margin-top:4px}
.emb>:not(.th):not(.f){grid-column:1}
.emb a{color:#00a8fc}
.skel{height:90px;border-radius:12px;margin-bottom:14px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.toast{position:fixed;right:20px;bottom:20px;background:var(--toast);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(23,32,51,.25);z-index:9;animation:up .25s var(--ease) both}
.toast.bad{background:var(--err)}.toast.out{opacity:0;transform:translateY(6px);transition:.4s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes sh{to{background-position:-200% 0}}
.btn,.chips button,.panel,.mod,.stat,input,select,textarea{transition:background-color .15s,border-color .15s,box-shadow .2s,transform .2s var(--ease),color .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,32,51,.12);border-color:var(--hov)}
.btn.primary:hover:not(:disabled){filter:brightness(.9);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.stat:hover,.mod:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(23,32,51,.09);border-color:var(--hov)}
.panel:hover{border-color:var(--hov);box-shadow:0 2px 10px rgba(23,32,51,.06)}
input[type=text]:hover,select:hover,textarea:hover{border-color:var(--hov)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);outline:0}
.chips button:hover{border-color:var(--accent);color:var(--accent);background:var(--card);transform:translateY(-1px)}
.user a:hover,nav .add:hover{text-decoration:underline}
.gate>*,main>h1,main>.sub,.h2,main>.panel,.cols>div>*,.sticky{animation:up .5s var(--ease) both}
.stat,.mod{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 80ms)}
.gate>:nth-child(2),main>.sub{animation-delay:.06s}.gate>:nth-child(3){animation-delay:.12s}
.cols>div>:nth-child(2),.sticky{animation-delay:.12s}.cols>div>:nth-child(3){animation-delay:.18s}.cols>div>:nth-child(4){animation-delay:.24s}
input[type=number]{width:84px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);margin:0 4px}
input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);outline:0}
.pn{max-width:720px}.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.rw{display:flex;gap:10px;align-items:center;margin-bottom:10px}.rw select{flex:1}.rw input{margin:0}.rw .btn{padding:8px 12px}
main>.pn{animation:up .5s var(--ease) both}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
*{scrollbar-width:thin;scrollbar-color:var(--hov) transparent}
header{transition:background-color .3s,box-shadow .3s}
header.scrolled{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 8px 28px rgba(10,16,30,.08)}
header::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:linear-gradient(90deg,var(--accent),#a06bff,#0ea5a4);transform:scaleX(var(--p,0));transform-origin:0 50%}
.grp{font-size:12px;font-weight:600;color:var(--muted);margin:16px 12px 4px}
.rv{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .7s var(--ease),transform .7s var(--ease),translate .25s var(--ease),box-shadow .2s,border-color .15s,background-color .15s;transition-delay:calc(var(--d,0)*70ms),calc(var(--d,0)*70ms),0s,0s,0s,0s}
.rv.in{opacity:1;transform:none}
main .rv.rv{animation:none}
.stat:hover,.mod:hover{transform:none;translate:0 -4px}
.stat,.mod{position:relative;overflow:hidden}
.stat>*,.mod>*{position:relative}
.stat::before,.mod::before{content:"";position:absolute;inset:0;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 17%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.stat:hover::before,.mod:hover::before{opacity:1}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(42px);opacity:.5;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
.hero::before{width:220px;height:220px;right:-40px;top:-70px;background:#e879f9}
.hero::after{width:180px;height:180px;right:170px;bottom:-100px;background:#60a5fa;animation-delay:-4s}
.hero>*{position:relative;z-index:1}
.hero .gi{transform:translateY(calc(var(--sy,0)*-.05px))}
.switch input::after{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.check input:checked{animation:ck .28s var(--ease)}
.btn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);animation:rip .6s var(--ease);pointer-events:none}
@keyframes drift{to{transform:translate(-34px,20px) scale(1.18)}}
@keyframes ck{50%{transform:scale(1.3)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px) scaleY(.96)}}
.cb{position:relative}
.cb-btn{width:100%;min-height:42px;display:flex;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 38px 6px 10px;background:var(--field);cursor:pointer;position:relative}
.cb-btn:hover{border-color:var(--hov)}
.cb.open .cb-btn{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.cb-ar{position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .25s var(--ease)}
.cb.open .cb-ar{transform:translateY(-30%) rotate(225deg)}
.cb-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:88px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;animation:pop .25s var(--ease)}
.chip i{font-style:normal;cursor:pointer;width:18px;height:18px;margin-right:-6px;border-radius:50%;display:grid;place-items:center}
.chip i:hover{background:var(--accent);color:#fff}
.cb-ph{color:var(--muted)}
.cb-pop{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 44px rgba(10,16,30,.2);padding:8px;animation:drop .18s var(--ease);transform-origin:top}
.cb-q{margin-bottom:6px}
.cb-list{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto}
.cb-list li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;transition:background-color .12s,padding .15s var(--ease)}
.cb-list li:hover{background:var(--bg);padding-left:14px}
.cb-list li[aria-selected=true]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.cb-list li[aria-selected=true]::after{content:"\2713"}
.cb-list li[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.cb-list li[aria-disabled=true]:hover{background:none;padding-left:10px}
.cb-list .none{color:var(--muted);cursor:default}
.rw .cb{flex:1}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
.hl{display:flex;align-items:center;gap:4px}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px}.nb{display:none;align-items:center;gap:12px;padding:4px 10px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}.nbl{width:42px;height:42px}.nb b{display:block;font:700 18px var(--display)}.nb span{font-size:13px;color:var(--muted)}.hero .wm{position:absolute;right:-18px;bottom:-34px;width:200px;opacity:.17;filter:brightness(0) invert(1);z-index:0;pointer-events:none}.glogo{width:76px;height:76px;margin-bottom:18px;display:block}
.burger{display:none;width:40px;height:40px;border:0;background:none;border-radius:10px;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{width:20px;height:2px;border-radius:2px;background:var(--ink);transition:transform .3s var(--ease),opacity .2s}
.burger:hover{background:var(--bg)}
body.menu .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menu .burger span:nth-child(2){opacity:0}
body.menu .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.scrim{display:none}
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .gi2{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:hidden;flex:none;font-weight:700}
.arow .gi2 img{width:100%;height:100%}
.arow .grow{flex:1;min-width:0}
.arow .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.addrow{display:flex;gap:10px;flex-wrap:wrap}.addrow input[type=text]{flex:1;min-width:150px}
.perms{display:flex;gap:6px;flex-wrap:wrap}

@media(max-width:900px){
 header{padding:8px 12px;z-index:50}
 body.has-nav .burger{display:flex}
 .nb{display:flex}
 .app{display:block}
 nav{position:fixed;top:57px;bottom:0;left:0;width:min(84vw,300px);z-index:40;overflow:auto;border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .35s var(--ease),box-shadow .35s}
 body.menu nav{transform:none;box-shadow:14px 0 44px rgba(8,12,20,.3)}
 body.menu{overflow:hidden}
 .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,20,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}
 body.menu .scrim{opacity:1;pointer-events:auto}
 .cols{grid-template-columns:1fr}.sticky{position:static}
 main{padding:18px 14px 44px}main h1{font-size:24px}
 .hero{padding:20px;gap:14px}.hero .gi{width:52px;height:52px;font-size:22px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mods{grid-template-columns:1fr}
 .panel{padding:16px}
 input,select,textarea{font-size:16px}
 .actions{flex-wrap:wrap}.actions .btn{flex:1}
 table{display:block;overflow-x:auto}
 .rw{flex-wrap:wrap}.rw .cb{flex:1 1 100%;order:3}
 .gate{margin:7vh auto}.gate h1{font-size:30px}
 .toast{left:14px;right:14px;bottom:14px}
 .user span{display:none}.user{gap:10px}.hr{gap:10px}#theme{padding:6px 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="hl"><button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button><span class="brand" id="brand">Dashboard</span></div><div class="hr"><button class="btn" id="theme" type="button">Dark mode</button><div class="user" id="user"></div></div></header>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const curT=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a>$1</a>').replace(/\n/g,'<br>');

async function pick(id){menu(false);
  gid=id;$('#main').innerHTML='<div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div>';
  document.querySelectorAll('.sv').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));
  try{[data,ov,mods]=await Promise.all([api('/api/guilds/'+id),api(`/api/guilds/${id}/overview`),api(`/api/guilds/${id}/modules`)]);render()}
  catch(e){$('#main').innerHTML=`<p class="muted">${esc(e.message)}</p>`}
}
function go(v){menu(false);view=v;history.replaceState(null,'','#'+v);render()}
function render(){if(view.startsWith('a_')&&!me.admin)view='overview';
  document.querySelectorAll('#mods button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view));
  ({overview:Overview,welcome:Welcome,moderation:Moderation,leveling:Leveling,autoroles:AutoRoles,antispam:AntiSpam,security:SecurityView,commands:CommandsView,goodbye:GoodbyeView,logs:LogsView,panel:PanelView,a_overview:AdmOverview,a_servers:AdmServers,a_blacklist:AdmBlacklist,a_staff:AdmStaff,a_log:AdmLog})[view]();scrollTo({top:0,behavior:'instant'});fx();
}

const CB={};
const chItems=()=>data.channels.map(x=>({id:x.id,name:'#'+x.name}));
const roleItems=()=>mods.roles.map(r=>({id:r.id,name:r.name,off:!r.ok}));
function cbMake(id,items,sel,o={}){CB[id]={items,sel:[...sel],multi:o.multi!==false,ph:o.ph||'Select'};return `<div class="cb" id="${id}"><button type="button" class="cb-btn" aria-haspopup="listbox"></button><div class="cb-pop" hidden><input type="text" class="cb-q" placeholder="Search" aria-label="Search"><ul class="cb-list" role="listbox"></ul></div></div>`}
function cbDraw(id){const c=CB[id],el=$('#'+id);if(!el)return;const q=el.querySelector('.cb-q').value.toLowerCase(),nm=i=>c.items.find(x=>x.id===i)?.name;
  el.querySelector('.cb-btn').innerHTML=(c.sel.length?`<span class="cb-chips">${c.sel.map(i=>`<span class="chip">${esc(nm(i)||i)}${c.multi?`<i data-rm="${i}" role="button" aria-label="Remove">&times;</i>`:''}</span>`).join('')}</span>`:`<span class="cb-ph">${esc(c.ph)}</span>`)+'<span class="cb-ar"></span>';
  el.querySelector('.cb-list').innerHTML=c.items.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<li role="option" data-id="${x.id}" aria-selected="${c.sel.includes(x.id)}"${x.off?' aria-disabled="true"':''}>${esc(x.name)}${x.off?'<small>unavailable</small>':''}</li>`).join('')||'<li class="none">No matches</li>'}
const cbClose=o=>{o.classList.remove('open');o.querySelector('.cb-pop').hidden=true};
document.addEventListener('click',e=>{const cb=e.target.closest('.cb');
  document.querySelectorAll('.cb.open').forEach(o=>{if(o!==cb)cbClose(o)});if(!cb)return;const id=cb.id,c=CB[id],pop=cb.querySelector('.cb-pop');
  const rm=e.target.closest('[data-rm]');if(rm){c.sel=c.sel.filter(x=>x!==rm.dataset.rm);cbDraw(id);cb.dispatchEvent(new Event('change',{bubbles:true}));return}
  if(e.target.closest('.cb-btn')){const open=pop.hidden;pop.hidden=!open;cb.classList.toggle('open',open);if(open){const q=cb.querySelector('.cb-q');q.value='';cbDraw(id);q.focus()}return}
  const li=e.target.closest('li[data-id]');if(li&&li.getAttribute('aria-disabled')!=='true'){const v=li.dataset.id;
    if(c.multi)c.sel=c.sel.includes(v)?c.sel.filter(x=>x!==v):[...c.sel,v];else{c.sel=[v];cbClose(cb)}
    cbDraw(id);cb.dispatchEvent(new Event('change',{bubbles:true}))}});
document.addEventListener('input',e=>{const q=e.target.closest?.('.cb-q');if(q)cbDraw(q.closest('.cb').id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.cb.open').forEach(cbClose)});
const roleOpts=sel=>'<option value="">Select a role</option>'+mods.roles.map(r=>`<option value="${r.id}"${r.id===sel?' selected':''}${r.ok?'':' disabled'}>${esc(r.name)}${r.ok?'':' (unavailable)'}</option>`).join('');
const sw=(id,label,on)=>`<label class="switch" for="${id}">${label}<input id="${id}" type="checkbox" role="switch"${on?' checked':''}></label>`;
async function saveMod(name,body,btn){btn.disabled=true;try{await api(`/api/guilds/${gid}/modules/${name}`,{method:'PUT',body});mods.modules[name]=body;toast('Saved')}catch(e){toast(e.message,1)}btn.disabled=false}

function SecurityView(){
  const c=mods.modules.security;
  const opt=(v,cur,l)=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`;
  const n=(id,v,lo,hi)=>`<input type="number" id="${id}" min="${lo}" max="${hi}" value="${v}">`;
  $('#main').innerHTML=`<h1>Security</h1><p class="sub">Protect the server from raids and rogue admins. The server owner and whitelisted users are never punished. Alerts go to your moderation log channel.</p>

   <p style="margin:0">If one person does ${n('nl',c.nukeLimit,2,20)} of these within ${n('ns',c.nukeSeconds,3,60)} seconds, <select id="na" style="width:auto">${opt('strip',c.nukeAction,'remove their powerful roles')}${opt('kick',c.nukeAction,'kick them')}${opt('ban',c.nukeAction,'ban them')}</select>.</p>

const permLabel={view:'View stats and servers',blacklist:'Block servers and users',premium:'Manage premium',leave:'Remove the bot from servers',staff:'Manage staff'};
const can=p=>me.admin?.perms.includes(p);
const upt=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`};
async function adm(title,sub,build){
  const head=`<h1>${title}</h1><p class="sub">${sub}</p>`;
  $('#main').innerHTML=head+'<div class="skel"></div>';
  try{$('#main').innerHTML=head+await build()}catch(e){$('#main').innerHTML=head+`<div class="panel pn"><p class="muted">${esc(e.message)}</p></div>`}
  fx();
}
async function AdmOverview(){
  await adm('Bot overview','Live numbers for the whole bot.',async()=>{
    const o=await api('/api/admin/overview');
    const st=[['Servers',o.servers],['Members',o.members],['Ping',o.ping+' ms'],['Uptime',upt(o.uptime)],['Memory',o.memory+' MB'],['Premium servers',o.premium],['Blocked',o.blocked],['Warnings issued',o.warnings]];
    return `<div class="stats" style="margin-top:0">${st.map(([k,v],i)=>`<div class="stat" style="--i:${i}"><b>${typeof v==='number'?v.toLocaleString():esc(v)}</b><span>${k}</span></div>`).join('')}</div>
    <h2 class="h2">Your access</h2><div class="panel pn"><p style="margin:0 0 12px">Rank: <span class="pill on">${esc(me.admin.rank)}</span></p><div class="perms">${me.admin.perms.map(p=>`<span class="chip">${permLabel[p]}</span>`).join('')}</div></div>`;
  });
}
async function AdmServers(){
  let d=[];
  await adm('All servers','Every server the bot is in.',async()=>{d=await api('/api/admin/servers');return `<div class="panel pn"><input type="text" id="q" placeholder="Search by name or ID" aria-label="Search servers"><div id="sl" style="margin-top:10px"></div></div>`});
  if(!$('#q'))return;
  const draw=()=>{const q=$('#q').value.toLowerCase();$('#sl').innerHTML=d.filter(g=>g.name.toLowerCase().includes(q)||g.id.includes(q)).map(g=>`<div class="arow"><div class="gi2">${g.icon?`<img src="${esc(g.icon)}" alt="">`:esc(g.name[0])}</div><div class="grow"><b>${esc(g.name)}</b><small>${g.members.toLocaleString()} members &middot; owner ${esc(g.ownerId)} &middot; ${esc(g.id)}</small></div>
   ${can('premium')?`<label class="switch" style="margin:0;gap:8px">Premium<input type="checkbox" data-p="${g.id}"${g.premium?' checked':''}></label>`:(g.premium?'<span class="pill on">Premium</span>':'')}
   ${can('leave')?`<button class="btn" data-l="${g.id}">Leave</button>`:''}</div>`).join('')||'<p class="muted">No servers match.</p>'};
  $('#q').oninput=draw;draw();
  $('#sl').onchange=async e=>{const id=e.target.dataset.p;if(!id)return;try{await api(`/api/admin/servers/${id}/premium`,{method:'POST',body:{premium:e.target.checked}});d.find(g=>g.id===id).premium=e.target.checked;toast('Premium updated')}catch(x){toast(x.message,1);e.target.checked=!e.target.checked}};
  $('#sl').onclick=async e=>{const id=e.target.dataset.l;if(!id||!confirm('Remove the bot from this server?'))return;try{await api(`/api/admin/servers/${id}/leave`,{method:'POST',body:{}});d=d.filter(g=>g.id!==id);draw();toast('Left the server')}catch(x){toast(x.message,1)}};
}
async function AdmBlacklist(){
  let d=[];
  await adm('Blacklist','Blocked servers are removed and can not add the bot again. Blocked users can not use the dashboard.',async()=>{d=await api('/api/admin/blacklist');
    return `${can('blacklist')?`<div class="panel pn"><div class="addrow"><select id="bk" style="width:auto"><option value="guild">Server</option><option value="user">User</option></select><input type="text" id="bi" placeholder="ID" aria-label="ID"><input type="text" id="br" placeholder="Reason (optional)" aria-label="Reason"><button class="btn primary" id="ba">Block</button></div></div>`:''}<div class="panel pn" id="bl"></div>`});
  if(!$('#bl'))return;
  const draw=()=>{$('#bl').innerHTML=d.map(r=>`<div class="arow"><div class="grow"><b>${r.kind==='guild'?'Server':'User'} ${esc(r.id)}</b><small>${esc(r.reason||'No reason')} &middot; by ${esc(r.by||'unknown')} &middot; ${new Date(r.at).toLocaleDateString()}</small></div>${can('blacklist')?`<button class="btn" data-k="${r.kind}" data-i="${r.id}">Unblock</button>`:''}</div>`).join('')||'<p class="muted">Nothing is blocked.</p>'};
  draw();
  if($('#ba'))$('#ba').onclick=async e=>{e.target.disabled=true;try{await api('/api/admin/blacklist',{method:'POST',body:{kind:$('#bk').value,id:$('#bi').value,reason:$('#br').value}});d=await api('/api/admin/blacklist');draw();$('#bi').value='';$('#br').value='';toast('Blocked')}catch(x){toast(x.message,1)}e.target.disabled=false};
  $('#bl').onclick=async e=>{const k=e.target.dataset.k,i=e.target.dataset.i;if(!k)return;try{await api(`/api/admin/blacklist/${k}/${i}`,{method:'DELETE'});d=d.filter(r=>!(r.kind===k&&r.id===i));draw();toast('Unblocked')}catch(x){toast(x.message,1)}};
}
async function AdmStaff(){
  let d={staff:[],ranks:{}};
  const opts=cur=>Object.keys(d.ranks).filter(r=>r!=='owner').map(r=>`<option value="${r}"${r===cur?' selected':''}>${r}</option>`).join('');
  await adm('Staff','Give people access to this admin panel. What each rank can do is fixed, as shown below.',async()=>{d=await api('/api/admin/staff');
    return `<div class="panel pn"><div class="addrow"><input type="text" id="si" placeholder="Discord user ID" aria-label="Discord user ID"><select id="sr" style="width:auto">${opts('helper')}</select><button class="btn primary" id="sa">Add staff</button></div></div>
    <div class="panel pn" id="sl"></div>
    <h2 class="h2">What each rank can do</h2><div class="panel pn"><table><tr><th></th>${Object.keys(d.ranks).map(r=>`<th>${r}</th>`).join('')}</tr>${Object.keys(permLabel).map(p=>`<tr><td>${permLabel[p]}</td>${Object.values(d.ranks).map(ps=>`<td>${ps.includes(p)?'&#10003;':''}</td>`).join('')}</tr>`).join('')}</table></div>`});
  if(!$('#sl'))return;
  const draw=()=>{$('#sl').innerHTML=d.staff.map(s=>`<div class="arow"><div class="grow"><b>${esc(s.name)}</b><small>${esc(s.id)}</small></div><select data-r="${s.id}" style="width:auto" aria-label="Rank">${opts(s.rank)}</select><button class="btn" data-x="${s.id}">Remove</button></div>`).join('')||'<p class="muted">No staff yet. Add a user ID above.</p>'};
  draw();
  $('#sa').onclick=async e=>{e.target.disabled=true;try{const r=await api('/api/admin/staff',{method:'POST',body:{userId:$('#si').value,rank:$('#sr').value}});d=await api('/api/admin/staff');draw();$('#si').value='';toast(`Added ${r.name}`)}catch(x){toast(x.message,1)}e.target.disabled=false};
  $('#sl').onchange=async e=>{const id=e.target.dataset.r;if(!id)return;try{await api('/api/admin/staff',{method:'POST',body:{userId:id,rank:e.target.value}});toast('Rank updated')}catch(x){toast(x.message,1)}};
  $('#sl').onclick=async e=>{const id=e.target.dataset.x;if(!id||!confirm('Remove this person from staff?'))return;try{await api('/api/admin/staff/'+id,{method:'DELETE'});d=await api('/api/admin/staff');draw();toast('Removed')}catch(x){toast(x.message,1)}};
}
async function AdmLog(){
  await adm('Activity log','The last 50 actions taken in this admin panel.',async()=>{const d=await api('/api/admin/log');
    return `<div class="panel pn">${d.length?`<table><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr>${d.map(r=>`<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.who)}</td><td>${esc(r.action)}</td><td>${esc(r.detail||'')}</td></tr>`).join('')}</table>`:'<p class="muted">Nothing has happened yet.</p>'}</div>`});

function AntiSpam(){
  const c=mods.modules.antispam;
  $('#main').innerHTML=`<h1>Anti-spam</h1><p class="sub">Automatically time out members who flood a channel. Members with Manage Messages are ignored.</p>
  <div class="panel pn">${sw('en','Enable anti-spam',c.enabled)}<p style="margin:0">Time out anyone who sends <input type="number" id="n" min="3" max="20" value="${c.messages}"> messages within <input type="number" id="s" min="2" max="30" value="${c.seconds}"> seconds, for <input type="number" id="t" min="1" max="60" value="${c.timeoutMinutes}"> minutes.</p>
   <p style="margin:16px 0 0">Also time out anyone who mentions <input type="number" id="mn" min="0" max="30" value="${c.mentionLimit||0}"> or more people in one message (0 turns this off).</p></div>
  <div class="actions pn"><button class="btn primary" id="sv">Save changes</button></div>`;
  $('#sv').onclick=e=>saveMod('antispam',{enabled:$('#en').checked,messages:+$('#n').value,seconds:+$('#s').value,timeoutMinutes:+$('#t').value,mentionLimit:+$('#mn').value},e.target);

function Welcome(){
  const e=data.welcome.embed,w=data.welcome;
  $('#main').innerHTML=`<h1>Welcome message</h1><p class="sub">Greet new members in ${esc(data.sample.server)}. The preview updates as you type.</p>
  <div class="cols"><div>
   <div class="panel"><label class="switch" for="enabled">Send a welcome message<input id="enabled" type="checkbox" role="switch"></label>
    <label for="channelId">Channel</label><select id="channelId">${chanOpts(w.channelId)}</select></div>
   <div class="panel"><h3>Message</h3><label for="content">Text above the embed</label><textarea id="content"></textarea>
    <div class="chips" aria-label="Insert placeholder">${['{user}','{username}','{server}','{memberCount}'].map(p=>`<button type="button" data-p="${p}">${p}</button>`).join('')}</div></div>
   <div class="panel"><h3>Embed</h3>
    <div class="row"><div><label for="title">Title</label><input type="text" id="title"></div><input type="color" id="color" aria-label="Embed color"></div>
    <label for="description">Description</label><textarea id="description" style="min-height:110px"></textarea>
    <label for="thumbnail">Thumbnail</label><select id="thumbnail"><option value="none">None</option><option value="user">Member avatar</option><option value="server">Server icon</option></select>
    <label for="footer">Footer</label><input type="text" id="footer">
    <label class="check"><input type="checkbox" id="author">Show member name and avatar at the top</label>
    <label class="check"><input type="checkbox" id="footerIcon">Show server icon in the footer</label>
    <label class="check"><input type="checkbox" id="timestamp">Show timestamp</label></div>
   <div class="actions"><button class="btn primary" id="save">Save changes</button><button class="btn" id="test">Send test message</button></div>
  </div><aside class="sticky"><p class="pv-title">Preview</p><div id="pv"></div></aside></div>`;
  const f={enabled:w.enabled,content:w.content,...e};
  for(const k in f){const el=$('#'+k);if(el)el.type==='checkbox'?el.checked=f[k]:el.value=f[k]}
  last=$('#content');
  $('.chips').onclick=ev=>{const p=ev.target.dataset.p;if(!p)return;const s=last.selectionStart??last.value.length;last.setRangeText(p,s,last.selectionEnd??s,'end');last.focus();draw()};
  $('#save').onclick=()=>send('PUT');$('#test').onclick=()=>send('POST');draw();

const read=()=>{const v=id=>{const el=$('#'+id);return el.type==='checkbox'?el.checked:el.value};
  return{enabled:v('enabled'),channelId:v('channelId'),content:v('content'),embed:{color:v('color'),author:v('author'),title:v('title'),description:v('description'),thumbnail:v('thumbnail'),footer:v('footer'),footerIcon:v('footerIcon'),timestamp:v('timestamp')}}};
async function send(method){
  const btns=document.querySelectorAll('.actions .btn');btns.forEach(b=>b.disabled=true);
  try{const body=read();await api(`/api/guilds/${gid}/welcome`+(method==='PUT'?'':'/test'),{method,body});
    if(method==='PUT')data.welcome=body;toast(method==='PUT'?'Welcome settings saved':'Test message sent')}
  catch(e){toast(e.message,1)}
  btns.forEach(b=>b.disabled=false);
}
function draw(){
  const w=read(),e=w.embed,s=data.sample;
  const fill=t=>t.replaceAll('{user}','@'+s.username).replaceAll('{username}',s.username).replaceAll('{server}',s.server).replaceAll('{memberCount}',s.memberCount);
  const content=md(fill(w.content)).replaceAll(esc('@'+s.username),`<span class="mention">@${esc(s.username)}</span>`);
  const has=e.title||e.description||e.footer;
  const th=e.thumbnail==='user'?s.avatar:e.thumbnail==='server'?s.icon:null;
  $('#pv').innerHTML=`<div class="dc"><div class="av"><img src="/logo.png" alt=""></div><div style="min-width:0;flex:1"><div class="meta">${esc(me.botName)}<span class="tag">APP</span><span class="time">Today</span></div>
   ${content?`<div>${content}</div>`:''}
   ${has?`<div class="emb" style="border-left-color:${/^#[0-9a-f]{6}$/i.test(e.color)?e.color:'#888'}">
    ${e.author?`<div class="a"><img src="${esc(s.avatar)}" alt="">${esc(s.username)}</div>`:''}
    ${e.title?`<div class="t">${md(fill(e.title))}</div>`:''}${e.description?`<div class="d">${md(fill(e.description))}</div>`:''}
    ${th?`<img class="th" src="${esc(th)}" alt="">`:''}
    ${e.footer||e.timestamp?`<div class="f">${e.footerIcon&&s.icon&&e.footer?`<img src="${esc(s.icon)}" alt="">`:''}<span>${esc(fill(e.footer))}${e.timestamp?(e.footer?' • ':'')+'Today':''}</span></div>`:''}</div>`:''}
  </div></div>`;
}

const menu=o=>{document.body.classList.toggle('menu',o);const b=$('#burger');b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Close menu':'Open menu')};
$('#burger').onclick=()=>menu(!document.body.classList.contains('menu'));$('#scrim').onclick=()=>menu(false);
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
matchMedia('(min-width:901px)').addEventListener('change',e=>e.matches&&menu(false));
/* scroll + pointer effects */
const hdr=document.querySelector('header'),root2=document.documentElement;let tk=0;
addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const y=scrollY,h=root2.scrollHeight-innerHeight;hdr.classList.toggle('scrolled',y>8);root2.style.setProperty('--p',h>0?y/h:0);root2.style.setProperty('--sy',y)})},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1,rootMargin:'0px 0px -30px 0px'});
function fx(){document.querySelectorAll('main>h1,main>.sub,main .panel,main .stat,main .mod,main .h2,main .actions,main .hero').forEach(el=>{if(el.classList.contains('rv'))return;el.classList.add('rv');if(el.matches('.stat,.mod'))el.style.setProperty('--d',[...el.parentNode.children].indexOf(el));io.observe(el)})}
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.stat,.mod');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')},{passive:true});
document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('.btn.primary');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rip';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.append(s);setTimeout(()=>s.remove(),650)});
</script>

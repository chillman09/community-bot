<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#172033;--muted:#5b667a;--line:#d9dee6;--accent:#2f4bd8;--ok:#0f7b5f;--err:#b42318;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
:root{--field:#fff;--hov:var(--hov);--okbg:#dcf5ec;--toast:#172033;--sk1:#e3e7ec;--sk2:#f1f3f6;color-scheme:light}
:root[data-theme=dark]{--bg:#0e131b;--card:#161c27;--ink:#e7ebf3;--muted:#9aa5b8;--line:#283140;--accent:#6b83ff;--field:#0f141d;--hov:#3a4658;--ok:#3ccf9e;--okbg:#12372c;--err:#ff7b6e;--toast:#2a3342;--sk1:#1c2431;--sk2:#252f3f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e131b;--card:#161c27;--ink:#e7ebf3;--muted:#9aa5b8;--line:#283140;--accent:#6b83ff;--field:#0f141d;--hov:#3a4658;--ok:#3ccf9e;--okbg:#12372c;--err:#ff7b6e;--toast:#2a3342;--sk1:#1c2431;--sk2:#252f3f;color-scheme:dark}}
*{box-sizing:border-box}
.hr{display:flex;align-items:center;gap:16px}#theme{padding:6px 12px;font-size:13px}.chl{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-top:8px}.chl[hidden]{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font:700 20px var(--display);letter-spacing:-.01em}
.user{display:flex;align-items:center;gap:12px;color:var(--muted)}
.user img{width:28px;height:28px;border-radius:50%}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
.gate{max-width:560px;margin:14vh auto;padding:0 24px}
.gate h1{font:700 40px/1.1 var(--display);letter-spacing:-.02em;margin:0 0 12px}
.gate p{color:var(--muted);margin:0 0 24px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}
nav{padding:18px 14px;border-right:1px solid var(--line);background:var(--card)}
nav h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 10px 10px}
.servers{display:flex;flex-wrap:wrap;gap:8px;padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sv{width:38px;height:38px;border-radius:50%;border:0;padding:0;background:var(--bg);display:grid;place-items:center;font-weight:700;cursor:pointer;overflow:hidden;box-shadow:0 0 0 2px transparent;transition:transform .2s var(--ease),box-shadow .2s}
.sv img{width:100%;height:100%}
.sv:hover{transform:scale(1.1)}
.sv[aria-current=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
#mods button{position:relative;display:block;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;text-align:left;cursor:pointer;font-weight:500;transition:background-color .15s,padding .2s var(--ease)}
#mods button:hover{background:var(--bg);padding-left:16px}
#mods button[aria-current=true]{background:var(--bg);font-weight:600}
#mods button[aria-current=true]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
nav .add{display:block;margin:18px 10px 0;font-size:14px}
main{padding:28px;max-width:1180px;width:100%}
main h1{font:700 28px var(--display);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.h2{font:700 18px var(--display);margin:26px 0 12px}
.muted{color:var(--muted);margin:0}
.hero{display:flex;gap:18px;align-items:center;padding:26px;border-radius:16px;color:#fff;background:linear-gradient(115deg,#2f4bd8,#6a3df0 55%,#0ea5a4);background-size:200% 200%;animation:flow 14s ease infinite,up .5s var(--ease) both}
.hero .gi{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font:700 28px var(--display);overflow:hidden;flex:none}
.hero .gi img{width:100%;height:100%}
.hero h1{color:#fff;margin:0}.hero p{margin:2px 0 0;opacity:.85}
.stats,.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:16px}
.mods{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:0}
.stat,.mod,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat{padding:16px 18px}
.stat b{display:block;font:700 28px var(--display)}
.stat span{color:var(--muted);font-size:13px}
.mod{padding:18px}
.mod h3{margin:0;font:700 16px var(--display)}
.mod p{color:var(--muted);margin:6px 0 14px}
.rowb{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted)}
.pill.on{background:var(--okbg);color:var(--ok)}
.panel{padding:20px;margin-bottom:16px}
.panel h3{font:700 16px var(--display);margin:0 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid var(--line)}
dl{margin:0}dt{font:600 14px ui-monospace,Menlo,monospace;color:var(--accent);margin-top:10px}dt:first-child{margin-top:0}dd{margin:0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:start}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
label:first-of-type{margin-top:0}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--field)}
textarea{resize:vertical;min-height:72px}
.row{display:flex;gap:12px;align-items:center}.row>div{flex:1}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin:12px 0 0}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.switch{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(18px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:13px ui-monospace,Menlo,monospace;cursor:pointer}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;flex:none;background:var(--field);margin-top:19px}
.actions{display:flex;gap:10px;align-items:center}
.sticky{position:sticky;top:78px}
.pv-title{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.dc{background:#313338;color:#dbdee1;border-radius:10px;padding:16px;font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;gap:12px}
.dc .av{width:38px;height:38px;border-radius:50%;background:var(--accent);flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.dc .meta{font-weight:600;color:#fff}
.dc .tag{background:#5865f2;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;margin:0 6px;vertical-align:1px}
.dc .time{font-size:12px;color:#949ba4;font-weight:400}
.mention{background:#3c4270;color:#c9cdfb;border-radius:3px;padding:0 2px}
.emb{margin-top:6px;background:#2b2d31;border-left:4px solid #888;border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.emb>*{min-width:0}
.emb .a{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff}
.emb .a img,.emb .f img{width:22px;height:22px;border-radius:50%}
.emb .t{font-weight:700;color:#fff;font-size:16px}.emb .d{font-size:14px;overflow-wrap:anywhere}
.emb .th{grid-column:2;grid-row:1/4;width:72px;height:72px;border-radius:6px;object-fit:cover}
.emb .f{grid-column:1/3;display:flex;align-items:center;gap:8px;font-size:12px;color:#b5bac1;margin-top:4px}
.emb>:not(.th):not(.f){grid-column:1}
.emb a{color:#00a8fc}
.skel{height:90px;border-radius:12px;margin-bottom:14px;background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 50%,var(--sk1) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.toast{position:fixed;right:20px;bottom:20px;background:var(--toast);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(23,32,51,.25);z-index:9;animation:up .25s var(--ease) both}
.toast.bad{background:var(--err)}.toast.out{opacity:0;transform:translateY(6px);transition:.4s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes sh{to{background-position:-200% 0}}
.btn,.chips button,.panel,.mod,.stat,input,select,textarea{transition:background-color .15s,border-color .15s,box-shadow .2s,transform .2s var(--ease),color .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(23,32,51,.12);border-color:var(--hov)}
.btn.primary:hover:not(:disabled){filter:brightness(.9);box-shadow:0 6px 16px rgba(47,75,216,.32)}
.btn:active:not(:disabled){transform:none;box-shadow:none}
.stat:hover,.mod:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(23,32,51,.09);border-color:var(--hov)}
.panel:hover{border-color:var(--hov);box-shadow:0 2px 10px rgba(23,32,51,.06)}
input[type=text]:hover,select:hover,textarea:hover{border-color:var(--hov)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,75,216,.15);outline:0}
.chips button:hover{border-color:var(--accent);color:var(--accent);background:var(--card);transform:translateY(-1px)}
.user a:hover,nav .add:hover{text-decoration:underline}
.gate>*,main>h1,main>.sub,.h2,main>.panel,.cols>div>*,.sticky{animation:up .5s var(--ease) both}
.stat,.mod{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms + 80ms)}
.gate>:nth-child(2),main>.sub{animation-delay:.06s}.gate>:nth-child(3){animation-delay:.12s}
.cols>div>:nth-child(2),.sticky{animation-delay:.12s}.cols>div>:nth-child(3){animation-delay:.18s}.cols>div>:nth-child(4){animation-delay:.24s}
input[type=number]{width:84px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);margin:0 4px}
input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,75,216,.15);outline:0}
.pn{max-width:720px}.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.rw{display:flex;gap:10px;align-items:center;margin-bottom:10px}.rw select{flex:1}.rw input{margin:0}.rw .btn{padding:8px 12px}
main>.pn{animation:up .5s var(--ease) both}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}.cols{grid-template-columns:1fr}.sticky{position:static}main{padding:20px 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><span class="brand" id="brand">Dashboard</span><div class="hr"><button class="btn" id="theme" type="button">Dark mode</button><div class="user" id="user"></div></div></header>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const curT=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const paintT=()=>{$('#theme').textContent=curT()==='dark'?'Light mode':'Dark mode'};
$('#theme').onclick=()=>{const n=curT()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n)}catch{}paintT()};paintT();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a>$1</a>').replace(/\n/g,'<br>');
async function api(path,opt){const r=await fetch(path,opt&&{method:opt.method,headers:{'Content-Type':'application/json'},body:JSON.stringify(opt.body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong.');return j}
const toast=(m,bad)=>{const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;t.setAttribute('role','status');document.body.append(t);setTimeout(()=>t.classList.add('out'),2600);setTimeout(()=>t.remove(),3100)};
let me,gid,data,ov,mods,view=location.hash.slice(1)||'overview',last;
const VIEWS={overview:'Overview',welcome:'Welcome',moderation:'Moderation',leveling:'Leveling',autoroles:'Auto-roles',antispam:'Anti-spam',security:'Security',commands:'Commands'};
const chanOpts=sel=>`<option value="">Select a channel</option>`+data.channels.map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>#${esc(c.name)}</option>`).join('');

(async function init(){
  me=await api('/api/me');document.title=me.botName+' dashboard';$('#brand').textContent=me.botName;
  if(!me.user){const err=location.search.includes('error');
    root.innerHTML=`<section class="gate"><h1>Set up ${esc(me.botName)} for your server.</h1><p>${err?'Login failed. Try again.':'Sign in with Discord to manage welcome messages, moderation and more for servers you run.'}</p><a class="btn primary" href="/auth/login">Continue with Discord</a></section>`;return}
  $('#user').innerHTML=`${me.user.avatar?`<img src="${esc(me.user.avatar)}" alt="">`:''}<span>${esc(me.user.name)}</span><a href="/auth/logout">Log out</a>`;
  if(!me.guilds.length){root.innerHTML=`<section class="gate"><h1>Add ${esc(me.botName)} to a server.</h1><p>Servers appear here once the bot joins one where you have the Manage Server permission.</p><a class="btn primary" href="${esc(me.invite)}">Add to server</a></section>`;return}
  root.innerHTML=`<div class="app"><nav><h2>Servers</h2><div class="servers" id="servers"></div><h2>Modules</h2><div id="mods"></div><a class="add" href="${esc(me.invite)}">Add to another server</a></nav><main id="main"></main></div>`;
  $('#servers').innerHTML=me.guilds.map(g=>`<button class="sv" data-id="${g.id}" title="${esc(g.name)}" aria-label="${esc(g.name)}">${g.icon?`<img src="${esc(g.icon)}" alt="">`:esc(g.name[0])}</button>`).join('');
  $('#mods').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
  $('#servers').onclick=e=>{const b=e.target.closest('.sv');b&&pick(b.dataset.id)};
  const m=$('#main');
  m.onclick=e=>{const b=e.target.closest('[data-v]');b&&go(b.dataset.v)};
  m.oninput=m.onchange=()=>view==='welcome'&&draw();
  m.addEventListener('focusin',e=>{if(e.target.matches('input[type=text],textarea'))last=e.target});
  $('#mods').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.v)};
  if(!VIEWS[view])view='overview';
  pick(me.guilds[0].id);
})();

async function pick(id){
  gid=id;$('#main').innerHTML='<div class="skel"></div><div class="skel" style="height:140px"></div><div class="skel"></div>';
  document.querySelectorAll('.sv').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));
  try{[data,ov,mods]=await Promise.all([api('/api/guilds/'+id),api(`/api/guilds/${id}/overview`),api(`/api/guilds/${id}/modules`)]);render()}
  catch(e){$('#main').innerHTML=`<p class="muted">${esc(e.message)}</p>`}
}
function go(v){view=v;history.replaceState(null,'','#'+v);render()}
function render(){
  document.querySelectorAll('#mods button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view));
  ({overview:Overview,welcome:Welcome,moderation:Moderation,leveling:Leveling,autoroles:AutoRoles,antispam:AntiSpam,security:SecurityView,commands:CommandsView})[view]();scrollTo(0,0);
}

function Overview(){
  const s=data.sample,w=data.welcome,m=ov.moderation;
  const stats=[['Members',ov.memberCount],['Channels',ov.channelCount],['Roles',ov.roleCount],['Warnings issued',ov.warningCount]];
  $('#main').innerHTML=`<section class="hero"><div class="gi">${s.icon?`<img src="${esc(s.icon)}" alt="">`:esc(s.server[0])}</div><div><h1>${esc(s.server)}</h1><p>Manage how ${esc(me.botName)} runs in this server.</p></div></section>
  <div class="stats">${stats.map(([k,v],i)=>`<div class="stat" style="--i:${i}"><b data-n="${v}">0</b><span>${k}</span></div>`).join('')}</div>
  <h2 class="h2">Modules</h2><div class="mods">
   <article class="mod" style="--i:0"><div class="rowb"><h3>Welcome</h3><span class="pill ${w.enabled?'on':''}">${w.enabled?'On':'Off'}</span></div><p>Greet new members with a fully custom embed.</p><button class="btn" data-v="welcome">Configure</button></article>
   <article class="mod" style="--i:1"><div class="rowb"><h3>Moderation</h3><span class="pill ${m.logChannelId?'on':''}">${m.logChannelId?'Logging on':'No log channel'}</span></div><p>Kick, ban, timeout and warn with a mod log.</p><button class="btn" data-v="moderation">Configure</button></article>
   ${[['leveling','Leveling','XP, ranks and role rewards for active members.'],['autoroles','Auto-roles','Give new members roles automatically.'],['antispam','Anti-spam','Time out members who flood the chat.'],['security','Security','Anti-nuke, anti-raid and account checks.']].map(([k,t,d],i)=>`<article class="mod" style="--i:${i+2}"><div class="rowb"><h3>${t}</h3><span class="pill ${mods.modules[k].enabled?'on':''}">${mods.modules[k].enabled?'On':'Off'}</span></div><p>${d}</p><button class="btn" data-v="${k}">Configure</button></article>`).join('')}</div>
  <h2 class="h2">Recent warnings</h2><div class="panel">${ov.warnings.length?`<table><tr><th>Member</th><th>Reason</th><th>By</th><th>Date</th></tr>${ov.warnings.map(r=>`<tr><td>${esc(r.user)}</td><td>${esc(r.reason)}</td><td>${esc(r.mod)}</td><td>${new Date(r.at).toLocaleDateString()}</td></tr>`).join('')}</table>`:'<p class="muted">No warnings yet. Use /warn in Discord to issue one.</p>'}</div>`;
  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n;if(calm)return el.textContent=n.toLocaleString();const t0=performance.now();(function f(t){const p=Math.min((t-t0)/800,1);el.textContent=Math.round(n*(1-(1-p)**3)).toLocaleString();p<1&&requestAnimationFrame(f)})(t0)});
}

function Moderation(){
  const m=ov.moderation;
  $('#main').innerHTML=`<h1>Moderation</h1><p class="sub">Actions are run with slash commands in Discord and recorded in your log channel.</p>
  <div class="cols"><div><div class="panel"><h3>Logging</h3><label for="log">Mod log channel</label><select id="log">${chanOpts(m.logChannelId)}</select>
   <label class="check"><input type="checkbox" id="dm"${m.dm?' checked':''}>Send members a DM when they are kicked, banned, timed out or warned</label></div>
   <div class="actions"><button class="btn primary" id="msave">Save changes</button></div></div>
  <aside class="sticky"><div class="panel"><h3>Slash commands</h3><dl>
   <dt>/warn</dt><dd>Record a warning for a member.</dd><dt>/warnings</dt><dd>Show a member's recent warnings.</dd>
   <dt>/timeout</dt><dd>Mute a member for a set number of minutes.</dd><dt>/kick</dt><dd>Remove a member. They can rejoin.</dd><dt>/ban</dt><dd>Ban a member from the server.</dd></dl></div></aside></div>`;
  $('#msave').onclick=async e=>{e.target.disabled=true;const body={logChannelId:$('#log').value,dm:$('#dm').checked};
    try{await api(`/api/guilds/${gid}/moderation`,{method:'PUT',body});ov.moderation=body;toast('Moderation settings saved')}catch(x){toast(x.message,1)}e.target.disabled=false};
}


const roleOpts=sel=>'<option value="">Select a role</option>'+mods.roles.map(r=>`<option value="${r.id}"${r.id===sel?' selected':''}${r.ok?'':' disabled'}>${esc(r.name)}${r.ok?'':' (unavailable)'}</option>`).join('');
const sw=(id,label,on)=>`<label class="switch" for="${id}">${label}<input id="${id}" type="checkbox" role="switch"${on?' checked':''}></label>`;
async function saveMod(name,body,btn){btn.disabled=true;try{await api(`/api/guilds/${gid}/modules/${name}`,{method:'PUT',body});mods.modules[name]=body;toast('Saved')}catch(e){toast(e.message,1)}btn.disabled=false}

function Leveling(){
  const c=mods.modules.leveling;let rw=c.rewards.map(r=>({...r}));
  $('#main').innerHTML=`<h1>Leveling</h1><p class="sub">Members earn XP by chatting (once a minute) and level up. They can check progress with /rank and /leaderboard.</p>
  <div class="panel pn">${sw('en','Enable leveling',c.enabled)}
   <label for="mode">Where members earn XP</label><select id="mode"><option value="all"${c.mode==='all'?' selected':''}>All channels</option><option value="only"${c.mode==='only'?' selected':''}>Only the selected channels</option><option value="except"${c.mode==='except'?' selected':''}>All channels except the selected ones</option></select>
   <div class="chl" id="chl">${data.channels.map(x=>`<label class="check"><input type="checkbox" value="${x.id}"${c.channelIds.includes(x.id)?' checked':''}>#${esc(x.name)}</label>`).join('')}</div>
   <label for="ch">Level-up announcements</label><select id="ch"><option value="">In the channel where they chatted</option>${data.channels.map(x=>`<option value="${x.id}"${x.id===c.channelId?' selected':''}>#${esc(x.name)}</option>`).join('')}</select>
   <label for="msg">Message</label><textarea id="msg">${esc(c.message)}</textarea><p class="hint">Use {user} and {level}.</p></div>
  <div class="panel pn"><h3>Role rewards</h3><div id="rw"></div><button class="btn" id="add">Add reward</button></div>
  <div class="actions pn" style="margin-bottom:8px"><button class="btn primary" id="sv">Save changes</button></div>
  <h2 class="h2">Top members</h2><div class="panel pn">${mods.leaders.length?`<table>${mods.leaders.map((r,i)=>`<tr><td>#${i+1}</td><td>${esc(r.name)}</td><td>Level ${r.level}</td><td>${r.xp.toLocaleString()} XP</td></tr>`).join('')}</table>`:'<p class="muted">No XP earned yet.</p>'}</div>`;
  const sync=()=>{$('#chl').hidden=$('#mode').value==='all'};$('#mode').onchange=sync;sync();
  const rows=()=>{$('#rw').innerHTML=rw.map((r,i)=>`<div class="rw"><span>Level</span><input type="number" min="1" max="200" value="${r.level}" data-i="${i}" aria-label="Level"><select data-i="${i}" aria-label="Role">${roleOpts(r.roleId)}</select><button class="btn" data-x="${i}" aria-label="Remove reward">&times;</button></div>`).join('')||'<p class="muted">No rewards yet.</p>'};
  $('#rw').onchange=$('#rw').oninput=e=>{const i=e.target.dataset.i;if(i==null)return;e.target.matches('input')?rw[i].level=+e.target.value:rw[i].roleId=e.target.value};
  $('#rw').onclick=e=>{const x=e.target.dataset.x;if(x!=null){rw.splice(+x,1);rows()}};
  $('#add').onclick=()=>{if(rw.length<10){rw.push({level:5,roleId:''});rows()}};
  $('#sv').onclick=e=>saveMod('leveling',{enabled:$('#en').checked,channelId:$('#ch').value,message:$('#msg').value,mode:$('#mode').value,channelIds:[...document.querySelectorAll('#chl input:checked')].map(x=>x.value),rewards:rw.filter(r=>r.roleId)},e.target);
  rows();
}
function AutoRoles(){
  const c=mods.modules.autoroles;
  $('#main').innerHTML=`<h1>Auto-roles</h1><p class="sub">Give new members roles when they join, or hand out a role right now.</p>
  <div class="panel pn">${sw('en','Give these roles to every new member',c.enabled)}<h3>Roles</h3>${mods.roles.map(r=>`<label class="check"><input type="checkbox" value="${r.id}"${c.roleIds.includes(r.id)?' checked':''}${r.ok?'':' disabled'}>${esc(r.name)}${r.ok?'':' (unavailable)'}</label>`).join('')||'<p class="muted">No roles to assign.</p>'}
   <p class="hint">Unavailable roles are above the bot's role or above yours. Drag the bot's role higher in Server Settings &rarr; Roles.</p></div>
  <div class="actions pn"><button class="btn primary" id="sv">Save changes</button></div>
  <h2 class="h2">Give a role now</h2><div class="panel pn"><label for="gr">Role</label><select id="gr">${roleOpts('')}</select>
   <label for="gt">Give it to</label><select id="gt"><option value="all">Everyone in the server</option><option value="one">One member</option></select>
   <div id="g1" hidden><label for="gu">Username or user ID</label><input type="text" id="gu" placeholder="e.g. kyrox or 123456789012345678"></div>
   <label class="check" id="g2"><input type="checkbox" id="gb" checked>Skip bots</label>
   <div class="actions" style="margin-top:16px"><button class="btn primary" id="go1">Give role</button></div></div>`;
  $('#sv').onclick=e=>saveMod('autoroles',{enabled:$('#en').checked,roleIds:[...document.querySelectorAll('.panel .check input:checked')].filter(x=>x.value).map(x=>x.value)},e.target);
  const sync=()=>{const one=$('#gt').value==='one';$('#g1').hidden=!one;$('#g2').hidden=one};$('#gt').onchange=sync;sync();
  $('#go1').onclick=async e=>{const roleId=$('#gr').value,all=$('#gt').value==='all';if(!roleId)return toast('Pick a role first',1);
   if(all&&!confirm('Give this role to every member of the server? Large servers can take a while.'))return;
   e.target.disabled=true;
   try{const r=await api(`/api/guilds/${gid}/autoroles/give`,{method:'POST',body:{roleId,target:all?'all':'one',user:$('#gu').value,skipBots:$('#gb').checked}});
    toast(all?`Giving the role to ${r.count} members. This runs in the background.`:`Gave the role to ${r.name}`)}catch(x){toast(x.message,1)}e.target.disabled=false};
}
function CommandsView(){
  const c=mods.modules.general,p=esc(c.prefix);
  $('#main').innerHTML=`<h1>Commands</h1><p class="sub">Choose the prefix members type before text commands in this server.</p>
  <div class="panel pn"><label for="px">Command prefix</label><input type="text" id="px" maxlength="3" value="${p}" style="max-width:120px"><p class="hint">Up to 3 characters, for example ? or !</p>
   ${mods.contentIntent?'':'<p class="hint" style="color:var(--err)">Text commands are switched off for this bot. Turn on Message Content Intent in the Discord Developer Portal, then add the variable MESSAGE_CONTENT=true in Railway.</p>'}</div>
  <div class="actions pn"><button class="btn primary" id="sv">Save changes</button></div>
  <h2 class="h2">Available commands</h2><div class="panel pn"><dl><dt>${p}help</dt><dd>Show every command.</dd><dt>${p}rank</dt><dd>Show your level, or mention someone else.</dd><dt>${p}leaderboard</dt><dd>Show the top members.</dd><dt>${p}ping</dt><dd>Check that the bot is awake.</dd>
   <dt>/help /rank /leaderboard</dt><dd>The same commands as slash commands.</dd></dl></div>`;
  $('#sv').onclick=e=>saveMod('general',{prefix:$('#px').value.trim()},e.target).then(()=>{mods.modules.general.prefix=$('#px').value.trim()||'?'});
}
function SecurityView(){
  const c=mods.modules.security;
  const opt=(v,cur,l)=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`;
  const n=(id,v,lo,hi)=>`<input type="number" id="${id}" min="${lo}" max="${hi}" value="${v}">`;
  $('#main').innerHTML=`<h1>Security</h1><p class="sub">Protect the server from raids and rogue admins. The server owner and whitelisted users are never punished. Alerts go to your moderation log channel.</p>
  <div class="panel pn"><h3>Anti-nuke</h3>${sw('ne','Watch for mass channel deletes, role deletes, bans and kicks',c.nukeEnabled)}
   <p style="margin:0">If one person does ${n('nl',c.nukeLimit,2,20)} of these within ${n('ns',c.nukeSeconds,3,60)} seconds, <select id="na" style="width:auto">${opt('strip',c.nukeAction,'remove their powerful roles')}${opt('kick',c.nukeAction,'kick them')}${opt('ban',c.nukeAction,'ban them')}</select>.</p>
   <p class="hint">Needs View Audit Log, and the bot's role must sit above the person it acts on. It reacts right after the limit is reached, so it limits damage rather than preventing the first action.</p></div>
  <div class="panel pn"><h3>Anti-raid</h3>${sw('re','Detect many people joining at once',c.raidEnabled)}
   <p style="margin:0">If ${n('rj',c.raidJoins,3,50)} members join within ${n('rs',c.raidSeconds,3,120)} seconds, <select id="ra" style="width:auto">${opt('alert',c.raidAction,'only send an alert')}${opt('kick',c.raidAction,'kick the new members')}${opt('ban',c.raidAction,'ban the new members')}</select>.</p></div>
  <div class="panel pn"><h3>Account checks</h3><p style="margin:0 0 16px">Kick accounts younger than ${n('ma',c.minAgeDays,0,365)} days (0 turns this off).</p>
   ${sw('bb','Remove bots added by anyone except the owner or whitelisted users',c.blockBots)}
   <label for="wl">Whitelist (user IDs, separated by commas)</label><input type="text" id="wl" value="${esc(c.whitelist.join(', '))}"></div>
  <div class="actions pn"><button class="btn primary" id="sv">Save changes</button></div>`;
  $('#sv').onclick=e=>saveMod('security',{nukeEnabled:$('#ne').checked,nukeLimit:+$('#nl').value,nukeSeconds:+$('#ns').value,nukeAction:$('#na').value,raidEnabled:$('#re').checked,raidJoins:+$('#rj').value,raidSeconds:+$('#rs').value,raidAction:$('#ra').value,minAgeDays:+$('#ma').value,blockBots:$('#bb').checked,whitelist:$('#wl').value.split(/[\s,]+/).filter(x=>/^\d{15,20}$/.test(x))},e.target);
}
function AntiSpam(){
  const c=mods.modules.antispam;
  $('#main').innerHTML=`<h1>Anti-spam</h1><p class="sub">Automatically time out members who flood a channel. Members with Manage Messages are ignored.</p>
  <div class="panel pn">${sw('en','Enable anti-spam',c.enabled)}<p style="margin:0">Time out anyone who sends <input type="number" id="n" min="3" max="20" value="${c.messages}"> messages within <input type="number" id="s" min="2" max="30" value="${c.seconds}"> seconds, for <input type="number" id="t" min="1" max="60" value="${c.timeoutMinutes}"> minutes.</p></div>
  <div class="actions pn"><button class="btn primary" id="sv">Save changes</button></div>`;
  $('#sv').onclick=e=>saveMod('antispam',{enabled:$('#en').checked,messages:+$('#n').value,seconds:+$('#s').value,timeoutMinutes:+$('#t').value},e.target);
}

function Welcome(){
  const e=data.welcome.embed,w=data.welcome;
  $('#main').innerHTML=`<h1>Welcome message</h1><p class="sub">Greet new members in ${esc(data.sample.server)}. The preview updates as you type.</p>
  <div class="cols"><div>
   <div class="panel"><label class="switch" for="enabled">Send a welcome message<input id="enabled" type="checkbox" role="switch"></label>
    <label for="channelId">Channel</label><select id="channelId">${chanOpts(w.channelId)}</select></div>
   <div class="panel"><h3>Message</h3><label for="content">Text above the embed</label><textarea id="content"></textarea>
    <div class="chips" aria-label="Insert placeholder">${['{user}','{username}','{server}','{memberCount}'].map(p=>`<button type="button" data-p="${p}">${p}</button>`).join('')}</div></div>
   <div class="panel"><h3>Embed</h3>
    <div class="row"><div><label for="title">Title</label><input type="text" id="title"></div><input type="color" id="color" aria-label="Embed color"></div>
    <label for="description">Description</label><textarea id="description" style="min-height:110px"></textarea>
    <label for="thumbnail">Thumbnail</label><select id="thumbnail"><option value="none">None</option><option value="user">Member avatar</option><option value="server">Server icon</option></select>
    <label for="footer">Footer</label><input type="text" id="footer">
    <label class="check"><input type="checkbox" id="author">Show member name and avatar at the top</label>
    <label class="check"><input type="checkbox" id="footerIcon">Show server icon in the footer</label>
    <label class="check"><input type="checkbox" id="timestamp">Show timestamp</label></div>
   <div class="actions"><button class="btn primary" id="save">Save changes</button><button class="btn" id="test">Send test message</button></div>
  </div><aside class="sticky"><p class="pv-title">Preview</p><div id="pv"></div></aside></div>`;
  const f={enabled:w.enabled,content:w.content,...e};
  for(const k in f){const el=$('#'+k);if(el)el.type==='checkbox'?el.checked=f[k]:el.value=f[k]}
  last=$('#content');
  $('.chips').onclick=ev=>{const p=ev.target.dataset.p;if(!p)return;const s=last.selectionStart??last.value.length;last.setRangeText(p,s,last.selectionEnd??s,'end');last.focus();draw()};
  $('#save').onclick=()=>send('PUT');$('#test').onclick=()=>send('POST');draw();
}
const read=()=>{const v=id=>{const el=$('#'+id);return el.type==='checkbox'?el.checked:el.value};
  return{enabled:v('enabled'),channelId:v('channelId'),content:v('content'),embed:{color:v('color'),author:v('author'),title:v('title'),description:v('description'),thumbnail:v('thumbnail'),footer:v('footer'),footerIcon:v('footerIcon'),timestamp:v('timestamp')}}};
async function send(method){
  const btns=document.querySelectorAll('.actions .btn');btns.forEach(b=>b.disabled=true);
  try{const body=read();await api(`/api/guilds/${gid}/welcome`+(method==='PUT'?'':'/test'),{method,body});
    if(method==='PUT')data.welcome=body;toast(method==='PUT'?'Welcome settings saved':'Test message sent')}
  catch(e){toast(e.message,1)}
  btns.forEach(b=>b.disabled=false);
}
function draw(){
  const w=read(),e=w.embed,s=data.sample;
  const fill=t=>t.replaceAll('{user}','@'+s.username).replaceAll('{username}',s.username).replaceAll('{server}',s.server).replaceAll('{memberCount}',s.memberCount);
  const content=md(fill(w.content)).replaceAll(esc('@'+s.username),`<span class="mention">@${esc(s.username)}</span>`);
  const has=e.title||e.description||e.footer;
  const th=e.thumbnail==='user'?s.avatar:e.thumbnail==='server'?s.icon:null;
  $('#pv').innerHTML=`<div class="dc"><div class="av">${esc(me.botName[0])}</div><div style="min-width:0;flex:1"><div class="meta">${esc(me.botName)}<span class="tag">APP</span><span class="time">Today</span></div>
   ${content?`<div>${content}</div>`:''}
   ${has?`<div class="emb" style="border-left-color:${/^#[0-9a-f]{6}$/i.test(e.color)?e.color:'#888'}">
    ${e.author?`<div class="a"><img src="${esc(s.avatar)}" alt="">${esc(s.username)}</div>`:''}
    ${e.title?`<div class="t">${md(fill(e.title))}</div>`:''}${e.description?`<div class="d">${md(fill(e.description))}</div>`:''}
    ${th?`<img class="th" src="${esc(th)}" alt="">`:''}
    ${e.footer||e.timestamp?`<div class="f">${e.footerIcon&&s.icon&&e.footer?`<img src="${esc(s.icon)}" alt="">`:''}<span>${esc(fill(e.footer))}${e.timestamp?(e.footer?' • ':'')+'Today':''}</span></div>`:''}</div>`:''}
  </div></div>`;
}
</script>
</body>
</html>
